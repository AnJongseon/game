<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니 바둑 게임</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 {
            color: #333;
            margin-bottom: 5px;
        }
        #status {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        canvas {
            background-color: #e4a64c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #passBtn {
            background-color: #6c757d;
        }
        #passBtn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <h2>미니 바둑 게임 (9줄 바둑)</h2>
    <div id="status">흑(⚫) 차례입니다 | 패스 횟수: 0</div>
    <canvas id="badukBoard" width="420" height="420"></canvas>
    
    <div class="btn-group">
        <button id="passBtn" onclick="passTurn()">패스 (Pass)</button>
        <button onclick="resetGame()">게임 다시 시작</button>
    </div>

    <script>
        const canvas = document.getElementById('badukBoard');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        const boardSize = 9; // 미니 바둑용 9x9 판
        const margin = 30;
        const boardWidth = canvas.width - (margin * 2);
        const gridS = boardWidth / (boardSize - 1);
        
        let board = Array.from(Array(boardSize), () => Array(boardSize).fill(0));
        let turn = 1; // 1: 흑(⚫), 2: 백(⚪)
        let passCount = 0;
        let gameOver = false;

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 바둑판 선 그리기
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let i = 0; i < boardSize; i++) {
                let pos = margin + gridS * i;
                // 가로선
                ctx.beginPath();
                ctx.moveTo(margin, pos);
                ctx.lineTo(margin + boardWidth, pos);
                ctx.stroke();
                // 세로선
                ctx.beginPath();
                ctx.moveTo(pos, margin);
                ctx.lineTo(pos, margin + boardWidth);
                ctx.stroke();
            }

            // 화점(점) 찍기 (9x9 기준 핵심 위치)
            const starPoints = [[2, 2], [2, 6], [4, 4], [6, 2], [6, 6]];
            ctx.fillStyle = '#333';
            for (let pt of starPoints) {
                let x = margin + gridS * pt[1];
                let y = margin + gridS * pt[0];
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // 돌 그리기
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] !== 0) {
                        let x = margin + gridS * c;
                        let y = margin + gridS * r;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, gridS * 0.45, 0, Math.PI * 2);
                        ctx.fillStyle = board[r][c] === 1 ? '#000' : '#fff';
                        ctx.fill();
                        ctx.strokeStyle = '#000';
                        ctx.stroke();
                    }
                }
            }
        }

        // 클릭 이벤트 (착점)
        canvas.addEventListener('click', function(event) {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            let c = Math.round((mouseX - margin) / gridS);
            let r = Math.round((mouseY - margin) / gridS);

            if (r >= 0 && r < boardSize && c >= 0 && c < boardSize) {
                if (board[r][c] === 0) {
                    board[r][c] = turn;
                    passCount = 0; // 돌을 놓으면 패스 카운트 초기화
                    drawBoard();

                    turn = 3 - turn; // 턴 교체
                    updateStatus();
                }
            }
        });

        function passTurn() {
            if (gameOver) return;
            passCount++;
            if (passCount >= 2) {
                endGame();
                return;
            }
            turn = 3 - turn;
            updateStatus();
        }

        function updateStatus() {
            let playerStr = turn === 1 ? '흑(⚫)' : '백(⚪)';
            statusDiv.innerText = `${playerStr} 차례입니다 | 연속 패스: ${passCount}/2`;
        }

        function endGame() {
            gameOver = true;
            let blackCount = 0;
            let whiteCount = 0;

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] === 1) blackCount++;
                    if (board[r][c] === 2) whiteCount++;
                }
            }

            let resultText = `게임 종료! (흑 돌: ${blackCount개}, 백 돌: ${whiteCount개})`;
            if (blackCount > whiteCount) {
                resultText += " 흑(⚫) 승리!";
            } else if (whiteCount > blackCount) {
                resultText += " 백(⚪) 승리!";
            } else {
                resultText += " 무승부!";
            }
            statusDiv.innerText = resultText;
        }

        function resetGame() {
            board = Array.from(Array(boardSize), () => Array(boardSize).fill(0));
            turn = 1;
            passCount = 0;
            gameOver = false;
            updateStatus();
            drawBoard();
        }

        drawBoard();
    </script>
</body>
</html>
